# =============================================================================
# AdaptiveRAG — Project Configuration
# =============================================================================
# This file defines all configurable parameters for the AdaptiveRAG pipeline.
# Modify values here to experiment with different settings.
# =============================================================================

project:
  name: "AdaptiveRAG"
  version: "0.1.0"
  description: "Adaptive Retrieval-Augmented Generation using Query Complexity and Context Optimization"

# --- Language Model Configuration ---
llm:
  model_name: "microsoft/Phi-3-mini-4k-instruct"
  max_new_tokens: 256
  temperature: 0.3
  top_p: 0.9
  device: "auto"  # "cpu", "cuda", or "auto"

# --- Embedding Model Configuration ---
embedding:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_dim: 384
  batch_size: 64
  device: "auto"

# --- Vector Database Configuration ---
vector_db:
  provider: "chromadb"
  collection_name: "adaptive_rag_documents"
  persist_directory: "./data/chromadb"
  distance_metric: "cosine"

# --- Retrieval Parameters ---
retrieval:
  simple_top_k: 3          # Top-K for simple queries (low retrieval depth)
  complex_top_k: 10        # Top-K for complex queries (high retrieval depth)
  similarity_threshold: 0.5
  chunk_size: 512
  chunk_overlap: 64

# --- Context Compression Parameters ---
compression:
  enabled: true
  method: "llmlingua"
  target_ratio: 0.5         # Target compression ratio (retain 50% of tokens)
  min_context_length: 50    # Minimum tokens to trigger compression
  force_tokens: ["?", ".", "!"]  # Tokens to preserve during compression

# --- Query Classifier Parameters ---
router:
  classifier_model: "microsoft/deberta-v3-base"
  complexity_threshold: 0.5  # Probability threshold for simple vs. complex
  labels:
    - "simple"
    - "complex"

# --- Evaluation Parameters ---
evaluation:
  metrics:
    - "recall_at_k"
    - "mrr"
    - "ndcg"
    - "latency"
    - "token_usage"
  recall_k_values: [1, 3, 5, 10]
  num_eval_samples: 500
  output_dir: "./results"

# --- Dataset Configuration ---
datasets:
  hotpotqa:
    name: "hotpot_qa"
    config: "fullwiki"
    split: "validation"
  popqa:
    name: "akariasai/PopQA"
    split: "test"

# --- Logging ---
logging:
  level: "INFO"
  log_file: "./logs/adaptive_rag.log"
  format: "%(asctime)s | %(name)-25s | %(levelname)-8s | %(message)s"
