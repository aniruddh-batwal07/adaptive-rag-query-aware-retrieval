compression:
  budget: 0.5
  enabled: true
evaluation:
  dataset: mixed
  sample_limit: 1000
  split: test
  split_ratios:
  - 0.7
  - 0.15
  - 0.15
generation:
  max_new_tokens: 256
  seed: 42
  temperature: 0.1
models:
  compressor:
    name: microsoft/llmlingua-2-bert-base-multilingual-cased-meetingbank
  embeddings:
    name: BAAI/bge-small-en-v1.5
  generator:
    name: HuggingFaceTB/SmolLM-135M-Instruct
  router:
    checkpoint: null
    name: distilbert-base-uncased
retrieval:
  baseline_k: 5
  chunk_overlap: 50
  chunk_size: 512
  k_complex: 10
  k_simple: 2
routing:
  fallback_route: SIMPLE
  threshold: null
runtime:
  batch_size: 1
  device: auto
